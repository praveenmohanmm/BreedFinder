name: iOS Signed Release

# Triggers:
#   • Automatically whenever a v* tag is pushed  →  git tag v2.1.5 && git push origin v2.1.5
#   • Manually via workflow_dispatch (useful for re-running a failed build)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v2.1.5)'
        required: true
        default: 'v2.1.5'

# Required secrets (Settings → Secrets and variables → Actions):
#   APPLE_CERTIFICATE_BASE64    — Development .p12 as base64
#   APPLE_CERTIFICATE_PASSWORD  — Password used when exporting the .p12
#   APPLE_PROVISIONING_PROFILE  — Development .mobileprovision as base64

env:
  XCODE_PROJECT: BreedFinder.xcodeproj
  SCHEME:        BreedFinder
  BUNDLE_ID:     com.poodlesoft.breedfinder
  APP_NAME:      Breed Finder

jobs:
  signed-ipa:
    name: Build · Sign · OTA · Release
    runs-on: macos-latest
    permissions:
      contents: write   # required to create/upload GitHub Release assets

    steps:
      # ── 1. Source ─────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Resolve release tag ────────────────────────────────────────────────
      #   Tag-push:          GITHUB_REF = refs/tags/v2.1.5  →  ref_name = v2.1.5
      #   workflow_dispatch: use the manual input instead
      - name: Resolve release tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          else
            RELEASE_TAG="${{ github.event.inputs.tag }}"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "Building: $RELEASE_TAG"

      # ── 3. Xcode ──────────────────────────────────────────────────────────────
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      # ── 4. App icon ───────────────────────────────────────────────────────────
      - name: Generate app icon
        run: |
          swift ci/generate_icon.swift \
            "BreedFinder/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"

      # ── 5. Certificate → temp keychain ────────────────────────────────────────
      - name: Import signing certificate
        env:
          P12_BASE64:   ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KC_PASS=$(openssl rand -base64 32)
          echo "KC_PASS=$KC_PASS" >> "$GITHUB_ENV"
          echo "KC_PATH=$KC"      >> "$GITHUB_ENV"

          echo "$P12_BASE64" | base64 --decode -o "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KC_PASS" "$KC"
          security default-keychain -s "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC"
          echo "Installed identities:"
          security find-identity -v -p codesigning "$KC"

      # ── 6. Provisioning profile ────────────────────────────────────────────────
      - name: Install provisioning profile
        env:
          PP_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          PP="$RUNNER_TEMP/profile.mobileprovision"
          echo "$PP_BASE64" | base64 --decode -o "$PP"

          security cms -D -i "$PP" > "$RUNNER_TEMP/profile.plist"
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID"             "$RUNNER_TEMP/profile.plist")
          PP_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name"             "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$RUNNER_TEMP/profile.plist")

          echo "Profile : $PP_NAME"
          echo "UUID    : $PP_UUID"
          echo "Team ID : $TEAM_ID"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP" ~/Library/MobileDevice/Provisioning\ Profiles/"$PP_UUID.mobileprovision"

          echo "PP_UUID=$PP_UUID" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

      # ── 7. Archive ─────────────────────────────────────────────────────────────
      - name: xcodebuild archive
        run: |
          ARCHIVE="$RUNNER_TEMP/BreedFinder.xcarchive"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          set -o pipefail
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme   "$SCHEME" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE" \
            -configuration Release \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE="$PP_UUID" \
            SWIFT_STRICT_CONCURRENCY=minimal \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
          test -d "$ARCHIVE" || {
            echo "::error::Archive not created — last 50 lines of build log:"
            tail -50 "$RUNNER_TEMP/xcodebuild.log"
            exit 1
          }
          echo "Archive size: $(du -sh "$ARCHIVE" | cut -f1)"

      # ── 8. ExportOptions.plist ─────────────────────────────────────────────────
      - name: Generate ExportOptions.plist
        run: |
          EXPORT_OPTS="$RUNNER_TEMP/ExportOptions.plist"
          python3 - <<PYEOF
          import os
          content = """<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>              <string>development</string>
              <key>teamID</key>              <string>{team}</string>
              <key>signingStyle</key>        <string>manual</string>
              <key>stripSwiftSymbols</key>   <true/>
              <key>compileBitcode</key>      <false/>
              <key>uploadSymbols</key>       <false/>
              <key>provisioningProfiles</key>
              <dict>
                  <key>{bundle}</key>        <string>{uuid}</string>
              </dict>
          </dict>
          </plist>""".format(
              team=os.environ["TEAM_ID"],
              bundle=os.environ["BUNDLE_ID"],
              uuid=os.environ["PP_UUID"],
          )
          with open(os.environ["EXPORT_OPTS"], "w") as f:
              f.write(content)
          print("ExportOptions written to", os.environ["EXPORT_OPTS"])
          PYEOF
        env:
          EXPORT_OPTS: ${{ runner.temp }}/ExportOptions.plist

      # ── 9. Export IPA ──────────────────────────────────────────────────────────
      - name: xcodebuild exportArchive
        run: |
          EXPORT_PATH="$RUNNER_TEMP/IPA"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportPath  "$EXPORT_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            2>&1 | tee "$RUNNER_TEMP/export.log"
          IPA=$(find "$EXPORT_PATH" -name "*.ipa" | head -1)
          test -f "$IPA" || {
            echo "::error::IPA not found after export — last 30 lines:"
            tail -30 "$RUNNER_TEMP/export.log"
            exit 1
          }
          echo "IPA_PATH=$IPA"               >> "$GITHUB_ENV"
          echo "IPA_NAME=$(basename "$IPA")" >> "$GITHUB_ENV"
          echo "IPA size: $(du -sh "$IPA" | cut -f1)"

      # ── 10. Generate manifest.plist + install.html ─────────────────────────────
      - name: Generate OTA files
        run: |
          REPO="${{ github.repository }}"
          BASE="https://github.com/${REPO}/releases/download/${RELEASE_TAG}"
          IPA_URL="${BASE}/${IPA_NAME}"
          MANIFEST_URL="${BASE}/manifest.plist"
          INSTALL_URL="${BASE}/install.html"

          echo "IPA      : $IPA_URL"
          echo "Manifest : $MANIFEST_URL"
          echo "Install  : $INSTALL_URL"

          RELEASE_TAG="$RELEASE_TAG" REPO="$REPO" \
          IPA_URL="$IPA_URL" MANIFEST_URL="$MANIFEST_URL" INSTALL_URL="$INSTALL_URL" \
          python3 - <<'PYEOF'
          import os, string
          env = os.environ
          for tmpl, out in [
              ("ci/manifest.plist.tmpl", env["RUNNER_TEMP"] + "/manifest.plist"),
              ("ci/install.html.tmpl",   env["RUNNER_TEMP"] + "/install.html"),
          ]:
              src = open(tmpl).read()
              result = string.Template(src).safe_substitute(env)
              open(out, "w").write(result)
              print(f"Generated {out}")
          PYEOF

          echo "MANIFEST_PATH=$RUNNER_TEMP/manifest.plist" >> "$GITHUB_ENV"
          echo "INSTALL_PATH=$RUNNER_TEMP/install.html"    >> "$GITHUB_ENV"
          echo "INSTALL_URL=$INSTALL_URL"                  >> "$GITHUB_ENV"

      # ── 11. Create GitHub Release + upload IPA / manifest / install.html ───────
      #   • If the release doesn't exist yet → gh release create makes it
      #   • If it was already created manually → skip create, upload anyway
      - name: Publish release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OTA_NOTES="### 🍎 iOS — Over The Air Install
          Open **[install.html](${INSTALL_URL})** in **Safari** on your iPhone/iPad and tap Install.
          > Your device UDID must be registered in the provisioning profile.
          > After install: **Settings → General → VPN & Device Management** → trust the certificate."

          # Create the release if it doesn't exist yet (ignore error if it does)
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes "$OTA_NOTES" \
            --repo "${{ github.repository }}" 2>/dev/null || true

          # Upload (--clobber replaces files if they were already uploaded)
          gh release upload "$RELEASE_TAG" \
            "$IPA_PATH" \
            "$MANIFEST_PATH" \
            "$INSTALL_PATH" \
            --repo "${{ github.repository }}" \
            --clobber

          echo "✅ Released: https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"

      # ── 12. Cleanup keychain ───────────────────────────────────────────────────
      - name: Remove temp keychain
        if: always()
        run: security delete-keychain "$KC_PATH" 2>/dev/null || true
