name: Android APK Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore dependencies
        run: dotnet restore BreedFinder.csproj

      - name: Build Android APK
        run: |
          dotnet publish BreedFinder.csproj \
            -f net10.0-android \
            -c Release \
            -p:AndroidKeyStore=false \
            -p:AndroidSdkDirectory=$ANDROID_SDK_ROOT

      - name: Locate APK
        id: find_apk
        run: |
          APK=$(find bin/Release/net10.0-android/publish -name "*.apk" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BreedFinder-Android-APK
          path: ${{ steps.find_apk.outputs.path }}
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Breed Finder — Build ${{ github.run_number }}"
          body: |
            ## Android APK — Build ${{ github.run_number }}

            Built from commit [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

            ### Install
            1. Download **BreedFinder.apk** below.
            2. On your Android device enable **Install from unknown sources**.
            3. Open the downloaded file and tap Install.
          files: ${{ steps.find_apk.outputs.path }}
          token: ${{ secrets.GITHUB_TOKEN }}
