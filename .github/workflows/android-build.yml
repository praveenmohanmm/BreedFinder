name: Android & iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# ─────────────────────────────────────────────────────────────────────────────
# iOS signing secrets required in repo Settings → Secrets → Actions:
#   APPLE_CERTIFICATE_BASE64        — base64 of your .p12 distribution certificate
#   APPLE_CERTIFICATE_PASSWORD      — password for the .p12
#   APPLE_PROVISIONING_PROFILE      — base64 of your .mobileprovision file
#   APPLE_PROVISIONING_PROFILE_NAME — profile name as shown in Xcode / Dev Portal
#   APPLE_CODESIGN_KEY              — signing identity, e.g. "Apple Distribution: …"
#
# Without these secrets the iOS job still compiles (validates the code) but
# skips IPA creation and the release will contain only the Android APK.
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ── Android ─────────────────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore BreedFinder.csproj -p:TargetFramework=net10.0-android

      - name: Publish APK
        run: |
          dotnet publish BreedFinder.csproj \
            --no-restore \
            -f net10.0-android \
            -c Release \
            -p:AndroidKeyStore=false \
            -p:AndroidSdkDirectory=$ANDROID_SDK_ROOT

      - name: Locate APK
        id: apk
        run: |
          path=$(find bin/Release/net10.0-android/publish -name "*.apk" | head -1)
          echo "path=$path" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

  # ── iOS ──────────────────────────────────────────────────────────────────────
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      # Select the latest stable Xcode on the runner and print version for diagnostics.
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Print Xcode version
        run: xcodebuild -version

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Print .NET SDK version
        run: dotnet --version

      # Pin workload set to 10.0.202 so the iOS SDK installed is 26.2.x,
      # which requires Xcode 26.2 — satisfied by the 26.3 on macos-15.
      # (Without pinning, install pulls the latest 26.5.x which needs Xcode 26.5.)
      - name: Install MAUI iOS workload
        run: |
          dotnet workload update --version 10.0.202
          dotnet workload install maui-ios

      - name: Restore
        run: dotnet restore BreedFinder.csproj -p:TargetFramework=net10.0-ios -p:RuntimeIdentifier=ios-arm64

      # Check whether signing secrets have been configured
      - name: Check signing secrets
        id: signing
        run: |
          if [ -n "$CERT" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}

      # Import certificate → temp keychain, then extract the exact identity
      # string so we never rely on a manually typed APPLE_CODESIGN_KEY secret.
      - name: Import signing certificate
        id: cert
        if: steps.signing.outputs.available == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PWD=$(openssl rand -base64 12)
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          echo -n "$CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 \
            -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # Add keychain to search list (include login.keychain so host tools find it)
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          # Extract the exact signing identity from the newly imported cert
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -E '"(Apple Distribution|iPhone Distribution|Apple Development)' \
            | head -1 \
            | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Signing identity: $IDENTITY"
          echo "codesign_key=$IDENTITY" >> $GITHUB_OUTPUT

      # Install provisioning profile (only when secrets are present)
      - name: Install provisioning profile
        if: steps.signing.outputs.available == 'true'
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$PROFILE_BASE64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      # Full signed publish → produces an IPA
      - name: Publish IPA (signed)
        if: steps.signing.outputs.available == 'true'
        run: |
          dotnet publish BreedFinder.csproj \
            --no-restore \
            -f net10.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ArchiveOnBuild=true \
            -p:CodesignKey="${{ steps.cert.outputs.codesign_key }}" \
            -p:CodesignProvision="${{ secrets.APPLE_PROVISIONING_PROFILE_NAME }}"

      # Unsigned build — validates code compiles, no IPA produced
      - name: Build iOS (unsigned — no signing secrets)
        if: steps.signing.outputs.available != 'true'
        run: |
          dotnet build BreedFinder.csproj \
            --no-restore \
            -f net10.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:CodesignKey="" \
            -p:CodesignProvision=""

      - name: Locate IPA
        id: ipa
        if: steps.signing.outputs.available == 'true'
        run: |
          path=$(find bin/Release/net10.0-ios -name "*.ipa" | head -1)
          echo "path=$path" >> $GITHUB_OUTPUT
          echo "Found IPA: $path"

      - name: Upload IPA artifact
        if: steps.signing.outputs.available == 'true' && steps.ipa.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ steps.ipa.outputs.path }}
          retention-days: 30

  # ── Release ───────────────────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    # Always run after both builds, but only on main pushes and only if Android succeeded
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.build-android.result == 'success'
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets/

      - name: Download iOS IPA (if available)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release-assets/

      - name: List release assets
        run: ls -lh release-assets/

      # Generate manifest.plist + install.html only when an IPA was produced
      - name: Generate iOS OTA files
        run: |
          TAG="build-${{ github.run_number }}"
          REPO="${{ github.repository }}"
          IPA_FILE=$(ls release-assets/*.ipa 2>/dev/null | head -1)

          if [ -z "$IPA_FILE" ]; then
            echo "No IPA found — skipping OTA file generation"
            exit 0
          fi

          IPA_NAME=$(basename "$IPA_FILE")
          IPA_URL="https://github.com/$REPO/releases/download/$TAG/$IPA_NAME"
          MANIFEST_URL="https://github.com/$REPO/releases/download/$TAG/manifest.plist"
          INSTALL_URL="https://github.com/$REPO/releases/download/$TAG/install.html"

          echo "IPA URL  : $IPA_URL"
          echo "Manifest : $MANIFEST_URL"

          # ── manifest.plist ────────────────────────────────────────────────
          cat > release-assets/manifest.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key>
                    <string>software-package</string>
                    <key>url</key>
                    <string>$IPA_URL</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key>
                  <string>com.poodlesoft.breedfinder</string>
                  <key>bundle-version</key>
                  <string>1.0.${{ github.run_number }}</string>
                  <key>kind</key>
                  <string>software</string>
                  <key>title</key>
                  <string>Breed Finder</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST

          # ── install.html ──────────────────────────────────────────────────
          cat > release-assets/install.html << HTML
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
            <title>Install Breed Finder</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
              }
              .card {
                background: #fff;
                border-radius: 24px;
                padding: 40px 32px;
                max-width: 380px;
                width: 100%;
                text-align: center;
                box-shadow: 0 20px 60px rgba(0,0,0,0.2);
              }
              .icon { font-size: 72px; margin-bottom: 16px; }
              h1 { font-size: 26px; font-weight: 700; color: #1E1B4B; margin-bottom: 6px; }
              .subtitle { font-size: 14px; color: #6B7280; margin-bottom: 8px; }
              .build { font-size: 12px; color: #9CA3AF; margin-bottom: 32px; }
              .btn {
                display: block;
                background: linear-gradient(135deg, #6366F1, #8B5CF6);
                color: #fff;
                font-size: 18px;
                font-weight: 700;
                text-decoration: none;
                padding: 18px 24px;
                border-radius: 16px;
                margin-bottom: 20px;
                transition: opacity .2s;
              }
              .btn:active { opacity: .85; }
              .steps {
                text-align: left;
                background: #F5F3FF;
                border-radius: 12px;
                padding: 16px;
                margin-top: 8px;
              }
              .steps p { font-size: 13px; color: #4B5563; font-weight: 600; margin-bottom: 8px; }
              .steps ol { padding-left: 18px; }
              .steps li { font-size: 13px; color: #6B7280; margin-bottom: 6px; line-height: 1.5; }
              .warning {
                font-size: 12px;
                color: #9CA3AF;
                margin-top: 20px;
                line-height: 1.6;
              }
            </style>
          </head>
          <body>
            <div class="card">
              <div class="icon">🐾</div>
              <h1>Breed Finder</h1>
              <p class="subtitle">Find your perfect dog breed</p>
              <p class="build">Build ${{ github.run_number }} &nbsp;·&nbsp; com.poodlesoft.breedfinder</p>

              <a class="btn" href="itms-services://?action=download-manifest&amp;url=$MANIFEST_URL">
                ⬇&nbsp; Install on iPhone / iPad
              </a>

              <div class="steps">
                <p>Before installing:</p>
                <ol>
                  <li>This app was signed with an <strong>Ad Hoc</strong> or <strong>Enterprise</strong> certificate — your UDID must be registered.</li>
                  <li>After install, go to <strong>Settings → General → VPN &amp; Device Management</strong> and trust the developer certificate.</li>
                  <li>Tap the button above on your iPhone or iPad (not on a Mac).</li>
                </ol>
              </div>

              <p class="warning">
                iOS OTA install requires a trusted HTTPS connection.<br>
                If the button does nothing, open this page in <strong>Safari</strong>.
              </p>
            </div>
          </body>
          </html>
          HTML

          echo "OTA files generated successfully"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Breed Finder — Build ${{ github.run_number }}"
          body: |
            ## Breed Finder — Build ${{ github.run_number }}

            Built from commit [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

            ### 🤖 Android
            Download **BreedFinder.apk** and install on your Android device.
            > Enable *Install from unknown sources* in Settings first.

            ### 🍎 iOS — Over The Air Install
            Open **[install.html](https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/install.html)** on your iPhone or iPad in **Safari** and tap the install button.
            > Your device UDID must be registered in the provisioning profile.
            > After install: Settings → General → VPN & Device Management → trust the certificate.
          files: release-assets/*
          token: ${{ secrets.GITHUB_TOKEN }}
