<?xml version="1.0" encoding="UTF-8"?>
<!-- Adaptive icon foreground — white paw on transparent bg.
     The purple background comes from the Color attribute in .csproj. -->
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">

  <!-- Main central pad -->
  <ellipse cx="228" cy="300" rx="100" ry="84" fill="white"/>

  <!-- Left outer toe -->
  <ellipse cx="122" cy="196" rx="44" ry="56" fill="white" transform="rotate(-22 122 196)"/>

  <!-- Left inner toe -->
  <ellipse cx="196" cy="155" rx="44" ry="56" fill="white" transform="rotate(-7 196 155)"/>

  <!-- Right inner toe -->
  <ellipse cx="272" cy="155" rx="44" ry="56" fill="white" transform="rotate(7 272 155)"/>

  <!-- Right outer toe -->
  <ellipse cx="346" cy="196" rx="44" ry="56" fill="white" transform="rotate(22 346 196)"/>
</svg>
