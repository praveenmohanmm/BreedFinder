<?xml version="1.0" encoding="UTF-8"?>
<!-- Splash screen — rendered centred on Color="#E8892B" warm amber background.
     All elements are white/semi-white on transparent. BaseSize 128x128. -->
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">

  <!-- Soft warm halo behind paw -->
  <ellipse cx="228" cy="210" rx="152" ry="152" fill="white" fill-opacity="0.10"/>

  <!-- ── Paw print (white) ──────────────────────────── -->

  <!-- Main central pad -->
  <ellipse cx="228" cy="258" rx="88" ry="74" fill="white"/>

  <!-- Left outer toe -->
  <ellipse cx="130" cy="165" rx="38" ry="49" fill="white" transform="rotate(-22 130 165)"/>

  <!-- Left inner toe -->
  <ellipse cx="196" cy="126" rx="38" ry="49" fill="white" transform="rotate(-7 196 126)"/>

  <!-- Right inner toe -->
  <ellipse cx="264" cy="126" rx="38" ry="49" fill="white" transform="rotate(7 264 126)"/>

  <!-- Right outer toe -->
  <ellipse cx="330" cy="165" rx="38" ry="49" fill="white" transform="rotate(22 330 165)"/>

  <!-- ── App name ─────────────────────────────────────── -->
  <text x="228" y="372"
        text-anchor="middle"
        font-family="sans-serif"
        font-size="46"
        font-weight="700"
        letter-spacing="1"
        fill="white">Breed Finder</text>

  <!-- Tagline -->
  <text x="228" y="414"
        text-anchor="middle"
        font-family="sans-serif"
        font-size="22"
        fill="white"
        fill-opacity="0.82">Find your perfect match 🐾</text>
</svg>
